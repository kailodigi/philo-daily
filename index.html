<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Philo Daily Brief</title>
  <style>
    :root { color-scheme: light; --paper: #f5efe4; --ink: #171412; --brick: #a44735; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--paper); color: var(--ink); font-family: ui-serif, Georgia, "Noto Serif SC", serif; }
    main { width: min(100% - 40px, 720px); margin: 0 auto; padding: 72px 0; }
    .eyebrow { margin: 0 0 16px; color: var(--brick); font: 700 0.78rem/1.4 ui-sans-serif, system-ui, sans-serif; letter-spacing: 0.16em; text-transform: uppercase; }
    h1 { margin: 0; max-width: 12ch; color: #0d0c0b; font-size: clamp(2.6rem, 12vw, 5.25rem); line-height: 0.96; letter-spacing: -0.055em; }
    .subtitle { margin: 24px 0 48px; font: 500 clamp(1.15rem, 5vw, 1.5rem)/1.5 ui-sans-serif, system-ui, sans-serif; }
    .rule { width: 80px; height: 5px; margin-bottom: 48px; background: var(--brick); }
    a { display: inline-flex; align-items: center; gap: 10px; color: var(--brick); font: 700 1rem/1.4 ui-sans-serif, system-ui, sans-serif; text-decoration: none; border-bottom: 2px solid currentColor; padding-bottom: 4px; }
    a:hover, a:focus-visible { color: #743022; }
    @media (min-width: 640px) { main { padding-top: 112px; } }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Industry intelligence · Daily</p>
    <h1>Philo Daily Brief</h1>
    <p class="subtitle">中文行业热点日报</p>
    <div class="rule" aria-hidden="true"></div>
    <a href="archive.html">历史日报 <span aria-hidden="true">→</span></a>
  </main>
</body>
</html>
