name: Daily Philo Brief

on:
  schedule:
    # 23:15 UTC = 07:15 Asia/Shanghai on the following day.
    - cron: "15 23 * * *"
  workflow_dispatch:
    inputs:
      brief_date:
        description: "Optional Beijing date (YYYY-MM-DD); blank uses today"
        required: false
        type: string

concurrency:
  group: daily-philo-brief-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      brief_date: ${{ steps.date.outputs.brief_date }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run offline unit tests
        run: python -m unittest discover -s tests -v

      - name: Resolve Beijing date
        id: date
        env:
          REQUESTED_DATE: ${{ inputs.brief_date }}
        run: |
          if [[ -n "$REQUESTED_DATE" ]]; then
            BRIEF_DATE="$REQUESTED_DATE"
          else
            BRIEF_DATE="$(TZ=Asia/Shanghai date +%F)"
          fi
          if [[ ! "$BRIEF_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::brief_date must use YYYY-MM-DD"
            exit 2
          fi
          echo "BRIEF_DATE=$BRIEF_DATE" >> "$GITHUB_ENV"
          echo "brief_date=$BRIEF_DATE" >> "$GITHUB_OUTPUT"

      - name: Check DashScope secret
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        run: |
          if [[ -z "$DASHSCOPE_API_KEY" ]]; then
            echo "::error::Repository secret DASHSCOPE_API_KEY is not configured"
            exit 2
          fi

      - name: Generate candidate daily brief
        id: generate
        continue-on-error: true
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          DASHSCOPE_MODEL: qwen-plus
          DASHSCOPE_TIMEOUT_SECONDS: "120"
          DASHSCOPE_SEARCH_MAX_TOKENS: "2400"
          DASHSCOPE_FINAL_MAX_TOKENS: "6000"
        run: python scripts/generate_daily.py --date "$BRIEF_DATE"

      - name: Record failed generation usage
        if: steps.generate.outcome == 'failure'
        run: |
          if [[ ! -s .build/usage.json ]]; then
            echo "::error::Generation failed before a usage snapshot was written"
            exit 1
          fi
          cp .build/usage.json data/usage.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/usage.json
          if git diff --cached --quiet; then
            echo "No failed-run usage changes to commit."
          else
            git commit -m "Record failed Philo Daily Brief usage $BRIEF_DATE"
            git push origin HEAD:main
          fi

      - name: Stop after failed generation
        if: steps.generate.outcome == 'failure'
        run: |
          echo "::error::Daily generation failed; previous Pages site remains unchanged"
          exit 1

      - name: Validate candidate daily HTML
        run: >-
          python scripts/validate_html.py
          ".build/$BRIEF_DATE.html"
          --site-root .
          --public-path "$BRIEF_DATE.html"

      - name: Promote daily and update indexes
        run: python scripts/update_archive.py --date "$BRIEF_DATE"

      - name: Validate promoted site
        run: >-
          python scripts/validate_html.py
          "$BRIEF_DATE.html" index.html archive.html
          --site-root .

      - name: Commit generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$BRIEF_DATE.html" index.html archive.html data/previous_events.json data/usage.json
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Publish Philo Daily Brief $BRIEF_DATE"
            git push origin HEAD:main
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build static Pages artifact
        run: |
          mkdir -p _site
          find . -maxdepth 1 -type f -name '*.html' -exec cp '{}' _site/ \;
          cp styles.css .nojekyll _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          include-hidden-files: true

  deploy:
    needs: generate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy current workflow artifact
        id: deployment
        uses: actions/deploy-pages@v4
